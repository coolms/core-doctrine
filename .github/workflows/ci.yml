name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Weekly, so a break from a dependency or a PHP point release shows up on a
  # Monday rather than inside someone's pull request.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        # --prefer-lowest is not padding. The constraints in composer.json are
        # a promise about what this works with, and the only way that promise
        # gets tested is by installing the floor of every range. Without it a
        # constraint can drift years below what the code actually needs and
        # nobody finds out until a consumer with an older lock installs it.
        deps: ['highest', 'lowest']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # Everything up to xmlwriter is PHPUnit's, from its composer.json
          # plus what its bootstrap checks at runtime; ctype and tokenizer are
          # runtime-only, so a list built from `require` alone installs fine
          # and then refuses to run. curl and phar are Composer's. pdo_sqlite
          # lets DBAL build a platform without a server.
          extensions: none, ctype, dom, filter, json, libxml, mbstring, tokenizer, xml, xmlwriter, curl, phar, pdo, pdo_sqlite

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.deps }}-

      # No composer.lock here (it's a library), so this resolves fresh every
      # run and catches a dependency drifting out from under the constraints.
      # The siblings this package requires at ^2.0 are not tagged yet: the
      # tag is made from the very merge this check is gating. Their
      # generation branch carries a branch-alias, so relaxing stability HERE
      # -- never in the published manifest, and after the validate step above
      # has already seen the real one -- lets the resolve succeed, which is
      # what lets the lint and test steps below run at all. Without it the
      # install fails and everything behind it is SKIPPED, so a red check
      # says nothing about the code. Once 2.0.0 is published, prefer-stable
      # picks the tag and these two lines do nothing.
      - name: Allow the untagged generation branch of siblings
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true

      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = 'lowest' ]; then
            composer update --prefer-lowest --prefer-dist --no-interaction --no-progress
          else
            composer update --prefer-dist --no-interaction --no-progress
          fi

      - name: Lint sources
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Run tests
        run: vendor/bin/phpunit --testdox

      # SimplifiedXmlDriver derives the mapping file name from the class name
      # minus the prefix. A mismatch is silent: the class simply never becomes
      # an entity. The package's own test asserts this too; here it also guards
      # a mapping file added without running the suite.
      - name: Assert every mapping file is named for the class it maps
        run: |
          fail=0
          for f in src/mapping/*.orm.xml; do
            class=$(grep -oP '(?<=<entity name="CoolMS\\Core\\)[A-Za-z\\]+' "$f" | head -1)
            expected=$(echo "$class" | tr '\\' '.').orm.xml
            if [ "$(basename "$f")" != "$expected" ]; then
              echo "::error file=$f::expected $expected for CoolMS\\Core\\$class"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "confirmed: every mapping file matches its class"
          exit $fail

  boundary:
    name: No application code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This package was extracted out of an application, and the whole point
      # of the extraction was that it stops depending on one. Asserted rather
      # than trusted, because a single `use App\...` added later would compile
      # fine here and break only for consumers.
      - name: Assert nothing references an application namespace
        run: |
          if grep -rnE '\bApp\\+[A-Z]' src/ ; then
            echo "::error::src/ references an application namespace"
            exit 1
          fi
          echo "confirmed: no application namespace in src/"
